apiVersion: apps/v1
kind: Deployment
metadata:
  name: interview-lesson
spec:
  replicas: 2
  selector:
    matchLabels:
      app: interview-lesson
  template:
    metadata:
      labels:
        app: interview-lesson
    spec:
      containers:
        - name: lesson
          image: interview-lesson:local
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: interview-lesson
spec:
  selector:
    app: interview-lesson
  ports:
    - port: 80
      targetPort: http
